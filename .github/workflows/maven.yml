```yaml
name: Maven Build Test and Publish

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Java and Maven
        run: |
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"
          echo "/opt/maven/bin" >> "$GITHUB_PATH"

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version
          which mvn

      - name: Build and Test Maven Project
        run: mvn clean verify

      - name: Publish to GitHub Packages
        run: mvn deploy
