name: Maven Build Test and Publish

on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 and GitHub Packages credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          cache: maven

      - name: Configure Maven path
        run: echo "/opt/maven/bin" >> "$GITHUB_PATH"

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build and Test
        run: mvn clean verify

      - name: Publish to GitHub Packages
        run: mvn deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
